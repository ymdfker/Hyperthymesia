# 每次推送：在各系统上跑单元测试，打包单个可执行文件，并对产物做冒烟测试。
# 推送 v* 标签时再把各系统产物发布到 GitHub Releases（install.sh / install.ps1 从 latest 下载）。
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, asset: hyperthymesia-macos-arm64}
          - {os: macos-15-intel, asset: hyperthymesia-macos-x64}
          - {os: ubuntu-latest, asset: hyperthymesia-linux-x64}
          - {os: windows-latest, asset: hyperthymesia-windows-x64.exe}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24'
      - name: 单元测试
        run: python -m unittest discover -s tests -v
      - name: 安装打包工具（只在构建时需要，产物不依赖它）
        run: python -m pip install pyinstaller==6.11.1
      - name: 打包
        run: python -m PyInstaller --onefile --name hyperthymesia --add-data "hyperthymesia/rules${{ runner.os == 'Windows' && ';' || ':' }}hyperthymesia/rules" --clean --noconfirm packaging/entry.py
      - name: 冒烟测试产物
        run: python packaging/smoke.py dist/hyperthymesia${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: 按发布名改名
        shell: bash
        run: mv dist/hyperthymesia${{ runner.os == 'Windows' && '.exe' || '' }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 发布到 Releases（连同安装脚本）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* install.sh install.ps1 --title "$GITHUB_REF_NAME" --generate-notes

  verify-windows-install:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-latest
    steps:
      - name: 验证公开一键安装下载本次发行（不调用模型）
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $testUserDirectory = Join-Path $env:RUNNER_TEMP ('hyperthymesia-install-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $testUserDirectory | Out-Null
          $previousUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:USERPROFILE = $testUserDirectory
          $env:HOME = $testUserDirectory
          $env:HYPERTHYMESIA_HOME = Join-Path $testUserDirectory 'memory'
          $env:WORKBUDDY_CONFIG_DIR = Join-Path $testUserDirectory '.workbuddy'
          $env:CODEBUDDY_CONFIG_DIR = $env:WORKBUDDY_CONFIG_DIR
          $env:HY_AGENTS = 'workbuddy'
          try {
            irm https://github.com/ymdfker/Hyperthymesia/releases/latest/download/install.ps1 | iex
            $installedBinary = Join-Path $testUserDirectory '.hyperthymesia/bin/hyperthymesia.exe'
            $actualVersion = & $installedBinary --version
            if ($LASTEXITCODE -ne 0 -or "$actualVersion".Trim() -ne $expectedVersion) { throw 'Installed version does not match release tag' }
            $settings = Get-Content -Raw (Join-Path $env:WORKBUDDY_CONFIG_DIR 'settings.json') | ConvertFrom-Json
            $mcp = Get-Content -Raw (Join-Path $env:WORKBUDDY_CONFIG_DIR 'mcp.json') | ConvertFrom-Json
            if (-not $settings.hooks.UserPromptSubmit -or -not $mcp.mcpServers.hyperthymesia) { throw 'Desktop integration files missing' }
            Write-Host "Verified public installer version $actualVersion and isolated WorkBuddy configuration; model calls: 0"
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $previousUserPath, 'User')
          }
